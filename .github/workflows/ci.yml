# 素构 Plainstruct —— 推送后自动构建,产物作为 Artifact 上传。
# 触发方式:
#   - 推送 main 分支(不发布,仅构建留档)
#   - 推送 v* 标签(自动创建 GitHub Release 草稿并附上安装包)
#   - 手动触发(workflow_dispatch)
#
# 矩阵:Windows(NSIS/MSI 安装包 + 免安装 zip)与 macOS arm64(dmg,Apple Silicon)。

name: Build Plainstruct

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest # Apple Silicon (arm64) runner
    runs-on: ${{ matrix.os }}
    env:
      # 版本号取自已打的标签(如 v0.1.0),未打标签时回退到 0.1.0
      APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: plainstruct-${{ matrix.os }}

      - name: Install frontend dependencies
        run: npm ci

      # Windows:NSIS 安装包与 MSI(WebView2 采用 embedBootstrapper,安装时自动引导)
      - name: Build Tauri bundles (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri -- build

      # 基于上一步的 release 可执行文件打免安装版 zip(脚本内部 --no-bundle,增量极快)
      - name: Build portable zip
        if: runner.os == 'Windows'
        run: npm run windows:portable
        shell: powershell

      # macOS arm64:仅构建 dmg
      - name: Build Tauri bundle (macOS arm64 dmg)
        if: runner.os == 'macOS'
        run: npm run tauri -- build --bundles dmg

      - name: Upload Windows installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: plainstruct-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows portable artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: plainstruct-x64-portable
          path: release/Plainstruct-x64-portable.zip
          if-no-files-found: warn

      - name: Upload macOS arm64 artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: plainstruct-macos-arm64-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # 推送 v* 标签时,汇总两个平台的产物创建 Release 草稿
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Plainstruct ${{ github.ref_name }}
          body: |
            自动构建的 Plainstruct ${{ github.ref_name }} 安装包。

            - Windows:NSIS 安装包与免安装版(zip);WebView2 采用 embedBootstrapper,安装时自动引导,无需预装运行库
            - macOS:Apple Silicon (arm64) 磁盘镜像(dmg),首次打开请右键选择「打开」以绕过未公证提示
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.zip
            artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
