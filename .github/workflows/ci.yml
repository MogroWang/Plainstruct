# 素构 Plainstruct —— 推送后自动构建,产物作为 Artifact 上传。
# 触发方式:
#   - 推送 main 分支(不发布,仅构建留档)
#   - 推送 v* 标签(自动创建 GitHub Release 草稿并附上安装包)
#   - 手动触发(workflow_dispatch)
#
# 如需 macOS / Linux 构建,把下面 jobs.build.strategy.matrix 取消注释即可,
# 它们各自使用对应平台的 runner 与系统依赖。

name: Build Plainstruct

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     platform: [windows-latest, macos-latest, ubuntu-latest]
    # runs-on: ${{ matrix.platform }}
    env:
      # 版本号取自已打的标签(如 v0.1.0),未打标签时回退到 0.1.0
      APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux 构建所需系统库(启用 ubuntu-latest 时使用)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # 完整构建:产出 NSIS 安装包与 release 可执行文件
      - name: Build Tauri bundles
        run: npm run tauri -- build

      # 基于上一步的 release 可执行文件打免安装版 zip(脚本内部 --no-bundle,增量极快)
      - name: Build portable zip
        run: npm run windows:portable
        shell: powershell

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: plainstruct-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: plainstruct-x64-portable
          path: release/Plainstruct-x64-portable.zip
          if-no-files-found: warn

      # 推送 v* 标签时,把安装包作为 Release 草稿发布
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Plainstruct ${{ env.APP_VERSION }}
          body: |
            自动构建的 Plainstruct ${{ env.APP_VERSION }} 安装包。

            - Windows:NSIS 安装包(上方 installer artifact)与免安装版(zip)
            - WebView2 采用 embedBootstrapper,安装时自动引导,无需预装运行库
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            release/Plainstruct-x64-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
